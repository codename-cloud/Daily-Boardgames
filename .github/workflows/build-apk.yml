name: Build Daily Boardgames APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Keystore and Environment
        env:
          KEYSTORE_BASE64: ""
        run: |
          # 1. Ensure .env exists for secrets-gradle-plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Helper to verify keystore integrity
          is_keystore_valid() {
            [ -f "$1" ] && [ -s "$1" ] && keytool -list -keystore "$1" -storepass android >/dev/null 2>&1
          }

          # 2. Decode the permanent debug keystore from file
          if ! is_keystore_valid debug.keystore; then
            rm -f debug.keystore debug.keystore.tmp
            if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore.tmp 2>/dev/null || base64 -di debug.keystore.base64 > debug.keystore.tmp 2>/dev/null || true
              if is_keystore_valid debug.keystore.tmp; then
                mv debug.keystore.tmp debug.keystore
              fi
            fi
          fi

          # 3. If still missing or invalid, decode directly from embedded base64 string
          if ! is_keystore_valid debug.keystore; then
            rm -f debug.keystore debug.keystore.tmp
            echo "$KEYSTORE_BASE64" | base64 -d > debug.keystore.tmp 2>/dev/null || echo "$KEYSTORE_BASE64" | base64 -di > debug.keystore.tmp 2>/dev/null || true
            if is_keystore_valid debug.keystore.tmp; then
              mv debug.keystore.tmp debug.keystore
            fi
          fi

          # 4. Fallback generation if decoding was not available or invalid
          if ! is_keystore_valid debug.keystore; then
            rm -f debug.keystore debug.keystore.tmp
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Keystore ready: $(ls -l debug.keystore)"

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Installable APK
        run: |
          ./gradlew assembleDebug \
            -Pandroid.injected.testOnly=false \
            -PbuildVersionCode=$((11 + ${{ github.run_number }})) \
            -PbuildVersionName="11.${{ github.run_number }}" \
            -PbuildRunNumber="${{ github.run_number }}" \
            -PbuildCommitSha="${{ github.sha }}" \
            -PbuildGithubRepo="${{ github.repository }}" \
            --no-daemon --stacktrace
          # Create clean APK filename without the -debug tag
          mkdir -p app/build/outputs/apk/release-artifact
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release-artifact/daily-boardgames.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-boardgames-apk
          path: app/build/outputs/apk/release-artifact/*.apk
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      - name: Publish GitHub Release APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="build-${RUN_NUMBER}"
          TITLE="Daily Boardgames v11.${RUN_NUMBER} (Build #${RUN_NUMBER})"

          PREV_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' 2>/dev/null || echo "")
          export PREV_TAG
          python3 - << 'PY' > release_notes.md
          import os, re, subprocess

          run_number = os.environ.get("RUN_NUMBER", "")
          sha = os.environ.get("COMMIT_SHA", "")[:7]
          prev_tag = os.environ.get("PREV_TAG", "").strip()
          head_msg = os.environ.get("HEAD_COMMIT_MSG", "").strip()

          def git_messages():
              if prev_tag and subprocess.run(["git", "rev-parse", "--verify", "--quiet", f"refs/tags/{prev_tag}"], capture_output=True).returncode == 0:
                  out = subprocess.check_output(["git", "log", f"{prev_tag}..HEAD", "--pretty=format:%B---COMMIT_END---"], text=True)
                  chunks = [c.strip() for c in out.split("---COMMIT_END---") if c.strip()]
                  if chunks:
                      return chunks[:10]
              out = subprocess.check_output(["git", "log", "-1", "--pretty=format:%B"], text=True).strip()
              if out:
                  return [out]
              return [head_msg] if head_msg else []

          def clean_line(line):
              line = re.sub(r'^\s*[-*•]\s*', '', line).strip()
              if not line:
                  return None
              low = line.lower()
              if low.startswith(("co-authored-by:", "signed-off-by:", "change-id:", "merge pull request ", "merge branch ")):
                  return None
              m = re.match(r'^([a-zA-Z]+)(?:\([^)]+\))?:\s*(.+)$', line)
              if m:
                  kind, rest = m.group(1).lower(), m.group(2).strip()
                  rest = rest[:1].upper() + rest[1:] if rest else rest
                  prefix_map = {
                      "feat": "New: ",
                      "feature": "New: ",
                      "fix": "Fixed: ",
                      "bugfix": "Fixed: ",
                      "perf": "Improved: ",
                      "refactor": "Improved: ",
                      "style": "Improved: ",
                      "ui": "Improved: ",
                  }
                  return f"{prefix_map.get(kind, '')}{rest}"
              return line[:1].upper() + line[1:]

          bullets = []
          seen = set()
          for msg in git_messages():
              for raw in msg.splitlines():
                  cleaned = clean_line(raw)
                  if cleaned and cleaned.lower() not in seen:
                      seen.add(cleaned.lower())
                      bullets.append(cleaned)

          if not bullets:
              bullets.append(f"Automated APK build from workflow run #{run_number}.")

          print(f"### What's New in Build #{run_number}")
          for b in bullets[:12]:
              print(f"- {b}")
          print("")
          print("---")
          print(f"Build #{run_number} • commit {sha}")
          PY

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md
            gh release upload "$TAG" app/build/outputs/apk/release-artifact/daily-boardgames.apk --clobber
          else
            gh release create "$TAG" app/build/outputs/apk/release-artifact/daily-boardgames.apk \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --latest
          fi
